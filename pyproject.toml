[tool.poetry]
name = "secure-sensitive-data-encrypt"
version = "0.1.0"
description = "Enterprise-grade secure password vault with multi-UI and strong crypto"
authors = ["Zaheer <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
cryptography = "^43.0.0"
fastapi = "^0.115.0"
uvicorn = {version = "^0.32.0", extras = ["standard"]}
jinja2 = "^3.1.4"
streamlit = "^1.38.0"
pydantic = "^2.9.0"
bcrypt = "^4.0.1"
itsdangerous = "^2.2.0"
python-multipart = "^0.0.20"
boto3 = "^1.35.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
mypy = "^1.11.0"
ruff = "^0.6.9"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"